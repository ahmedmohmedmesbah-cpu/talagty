<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة الإدارة - تلاجتى</title>
    <style>
        body {
            direction: rtl;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 2rem;
        }

        th, td {
            border: 1px solid #e5e7eb;
            padding: 0.75rem;
            text-align: right;
        }

        th {
            background: #f9fafb;
        }

        .refresh-btn {
            margin: 1rem 0;
        }

        h1, h2 {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>لوحة الإدارة - الطلبات</h1>

        <form id="login-form" style="max-width:420px;margin:1rem auto;display:grid;gap:.75rem">
            <label>البريد الإلكتروني <input id="admin-email" type="email" required autocomplete="username"></label>
            <label>كلمة المرور <input id="admin-password" type="password" required autocomplete="current-password"></label>
            <button class="btn btn-primary" type="submit">تسجيل الدخول</button>
            <p id="login-status" aria-live="polite"></p>
        </form>

        <button class="btn btn-primary refresh-btn" id="refresh-orders">تحديث الطلبات</button>

        <h2>الطلبات الواردة</h2>
        <table id="orders-table">
            <thead>
                <tr>
                    <th>التاريخ</th>
                    <th>اسم العميل</th>
                    <th>رقم الهاتف</th>
                    <th>العنوان</th>
                    <th>المحتويات</th>
                    <th>المجموع</th>
                    <th>الحالة</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

    </div>

    <script src="api-config.js"></script>
    <script>
        const apiBaseUrl = (window.TALLAGTY_API_BASE_URL || '').replace(/\/$/, '');
        let accessToken = sessionStorage.getItem('tallagtyAdminToken') || '';
        const statusLabels = {
            pending_assignment: 'بانتظار التجهيز',
            preparing: 'قيد التجهيز',
            out_for_delivery: 'خرج للتوصيل',
            completed: 'مكتمل',
            cancelled: 'ملغي'
        };
        const nextStatuses = {
            pending_assignment: ['preparing', 'cancelled'],
            preparing: ['out_for_delivery', 'cancelled'],
            out_for_delivery: ['completed'],
            completed: [],
            cancelled: []
        };

        function requestOptions(method = 'GET', body) {
            const headers = { Authorization: `Bearer ${accessToken}` };
            if (body) headers['Content-Type'] = 'application/json';
            return { method, headers, body: body ? JSON.stringify(body) : undefined };
        }

        async function fetchOrders() {
            const tbody = document.getElementById('orders-table').querySelector('tbody');
            tbody.innerHTML = '<tr><td colspan="8">جاري تحميل الطلبات...</td></tr>';
            if (!accessToken) {
                tbody.innerHTML = '<tr><td colspan="8">سجّل الدخول أولاً لعرض الطلبات.</td></tr>';
                return;
            }

            try {
                const response = await fetch(`${apiBaseUrl}/api/admin/orders`, requestOptions());
                if (!response.ok) {
                    if (response.status === 401) sessionStorage.removeItem('tallagtyAdminToken');
                    throw new Error('تعذر تحميل الطلبات. تأكد من تسجيل الدخول وإعداد رابط الخدمة.');
                }
                const orders = await response.json();

                tbody.innerHTML = ''; // Clear the table body

                if (!orders || orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8">لا توجد طلبات حتى الآن.</td></tr>';
                    return;
                }

                orders.forEach(order => {
                    const tr = document.createElement('tr');
                    const cells = [
                        order.created_at ? new Date(order.created_at).toLocaleString('ar-EG') : '—',
                        order.customer_name || '—', order.customer_phone || '—',
                        order.customer_address_text || '—',
                        (order.items || []).map(item => `${item.name} × ${item.quantity}`).join('، '),
                        `${order.total} ريال`, statusLabels[order.status] || order.status
                    ];
                    cells.forEach(text => { const cell = document.createElement('td'); cell.textContent = text; tr.appendChild(cell); });
                    const actionCell = document.createElement('td');
                    const choices = nextStatuses[order.status] || [];
                    if (!choices.length) actionCell.textContent = '—';
                    choices.forEach(nextStatus => {
                        const button = document.createElement('button');
                        button.className = 'btn btn-primary';
                        button.style.margin = '.15rem';
                        button.textContent = statusLabels[nextStatus];
                        button.addEventListener('click', () => updateOrderStatus(order.order_id, nextStatus));
                        actionCell.appendChild(button);
                    });
                    tr.appendChild(actionCell);
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error('Error fetching orders:', error);
                tbody.innerHTML = `<tr><td colspan="8">${error.message}</td></tr>`;
            }
        }

        async function updateOrderStatus(orderId, nextStatus) {
            try {
                const response = await fetch(`${apiBaseUrl}/api/admin/orders/${encodeURIComponent(orderId)}/status`, requestOptions('PATCH', { status: nextStatus }));
                if (!response.ok) throw new Error('تعذر تحديث حالة الطلب.');
                fetchOrders();
            } catch (error) { alert(error.message); }
        }

        document.getElementById('refresh-orders').addEventListener('click', () => {
            fetchOrders();
        });

        document.getElementById('login-form').addEventListener('submit', async event => {
            event.preventDefault();
            const statusEl = document.getElementById('login-status');
            try {
                const response = await fetch(`${apiBaseUrl}/api/auth/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('admin-email').value, password: document.getElementById('admin-password').value })
                });
                const data = await response.json();
                if (!response.ok || data.role !== 'admin') throw new Error(data.detail || 'بيانات الدخول غير صحيحة');
                accessToken = data.access_token;
                sessionStorage.setItem('tallagtyAdminToken', accessToken);
                statusEl.textContent = 'تم تسجيل الدخول بنجاح.';
                fetchOrders();
            } catch (error) { statusEl.textContent = error.message; }
        });

        document.addEventListener('DOMContentLoaded', () => {
            fetchOrders();
        });
    </script>
</body>
</html>
